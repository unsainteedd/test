<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Camera</title>
  <style>
    :root {
      --bg: #f5f5f4;
      --fg: #1c1917;
      --muted: #78716c;
      --accent: #2563eb;
      --danger: #b91c1c;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #131313;
        --fg: #f5f5f4;
        --muted: #a8a29e;
        --accent: #60a5fa;
        --danger: #f87171;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 16px;
    }
    .stage {
      width: min(100%, 720px);
      aspect-ratio: 4 / 3;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1); /* mirror view, like a selfie */
      display: none;
    }
    video.on { display: block; }
    .placeholder { color: #a8a29e; padding: 24px; text-align: center; }
    .placeholder.hidden { display: none; }
    .controls { display: flex; gap: 12px; }
    button {
      font: inherit;
      font-weight: 600;
      padding: 12px 24px;
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
    }
    button.secondary { background: transparent; color: var(--fg); border: 1px solid var(--muted); }
    button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    button[hidden] { display: none; }
    #msg { min-height: 1.4em; margin: 0; color: var(--muted); text-align: center; }
    #msg.error { color: var(--danger); }
  </style>
</head>
<body>
  <div class="stage">
    <p class="placeholder" id="placeholder">Camera is off</p>
    <video id="cam" autoplay playsinline muted></video>
  </div>

  <div class="controls">
    <button id="start">Turn on camera</button>
    <button id="stop" class="secondary" hidden>Turn off camera</button>
  </div>

  <p id="msg" role="status">Your video stays in your browser and is never uploaded.</p>

  <script>
    const video = document.getElementById("cam");
    const startBtn = document.getElementById("start");
    const stopBtn = document.getElementById("stop");
    const msg = document.getElementById("msg");
    const placeholder = document.getElementById("placeholder");
    let stream = null;

    function setMessage(text, isError = false) {
      msg.textContent = text;
      msg.className = isError ? "error" : "";
    }

    function explain(err) {
      switch (err.name) {
        case "NotAllowedError":
          return "Camera access was denied. Allow it in your browser's site settings, then try again.";
        case "NotFoundError":
          return "No camera was found on this device.";
        case "NotReadableError":
          return "The camera is in use by another app. Close it and try again.";
        default:
          return "Could not start the camera (" + err.name + ").";
      }
    }

    async function startCamera() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        setMessage("This page needs HTTPS (or localhost) to use the camera.", true);
        return;
      }
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user" },
          audio: false
        });
        video.srcObject = stream;
        video.classList.add("on");
        placeholder.classList.add("hidden");
        startBtn.hidden = true;
        stopBtn.hidden = false;
        setMessage("Camera is on.");
      } catch (err) {
        setMessage(explain(err), true);
      }
    }

    function stopCamera() {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }
      video.srcObject = null;
      video.classList.remove("on");
      placeholder.classList.remove("hidden");
      startBtn.hidden = false;
      stopBtn.hidden = true;
      setMessage("Camera is off.");
    }

    startBtn.addEventListener("click", startCamera);
    stopBtn.addEventListener("click", stopCamera);
  </script>
</body>
</html>
